<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070c17"><title>Supros · prévia das técnicas</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="identity.css"><link rel="stylesheet" href="transformations.css?v=20261023-storm2"><link rel="stylesheet" href="interface-motion.css?v=vasco1"><body data-form="base"><main style="max-width:960px;margin:auto;padding:32px"><div class="eyebrow">SUPROS · ESTUDO DE MOVIMENTO</div><h1>Técnicas em movimento</h1><p class="muted">Experimente as cenas sem consumir cargas ou alterar sua partida. Movimento reduzido do sistema é respeitado.</p><section class="panel"><div class="toolbar" id="techniques"></div></section><p><a href="combat-preview.html">War Lotus, Kirin & Godspeed →</a></p><p><a href="/">Voltar à ficha →</a></p><div id="fx-layer" aria-hidden="true"></div><div id="live-event" role="status" class="sr"></div></main><script type="module">
